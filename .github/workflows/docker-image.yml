name: Build serviceportal api and ui 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag serviceportal-api:$(date +%s)

    - name: Build UI Image
      run: docker build . --file Dockerfile --tag serviceportal-ui:$(date +%s)
      working-directory: ./ui
