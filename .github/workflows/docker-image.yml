name: Build serviceportal api and ui 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: |
       date_tag=$(date +%s)
       docker build . --file Dockerfile --tag deeveera/serviceopsportal/serviceportal-api:${date_tag}
       docker push deeveera/serviceopsportal/serviceportal-api:${date_tag}

    - name: Build UI Image
      working-directory: ./ui
      run: |
        docker build . --file Dockerfile --tag serviceportal-ui:$(date +%s)
      
